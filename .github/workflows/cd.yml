name : CD - Deploying to Azure


on :
  workflow_run :
    workflows : ["Java CI"]
    types : 
      - completed

permissions : 
  id-token : write
  contents : read

env:
  ResourceGroup : re-yeaga-cicd
  ContainerApp : re-yegava-java-app
  IMAGE : docker.io/yegavanaidu/my-java-app

jobs : 
  deploy :
    if : ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on : ubuntu-latest

    steps :
      - name : Azure login
        uses : azure/login@v2
        with :
          client-id : ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id : ${{ secrets.AZURE_TENANT_ID }}
          subscription-id : ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name : Get Release version
        id : version
        run : |
          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION=${TAG#v}

          echo "TAG"=$TAG
          echo "VERSION"=$VERSION

          echo "VRESION=$VERSION" >> $GITHUB_OUTPUT

      - name : Deploy to Azure Container App
        run  : |
          az containerapp update \
            --name ${{ env.ContainerApp }} \
            --resource-group ${{ env.ResourceGroup }} \
            --image ${{ env.IMAGE }}:${{ steps.version.outputs.VERSION }}