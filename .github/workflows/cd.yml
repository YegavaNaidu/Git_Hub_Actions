name : CD - Deploying to Azure


on :
  push:
    branches :
      - main

permissions : 
  id-token : write
  contents : read

env:
  ResourceGroup : rg-yeagav-cicd
  ContainerApp : ca-yegava-java-app
  IMAGE : docker.io/yegavanaidu/my-java-app

jobs :
  CI :
    uses : ./.github/workflows/ci.yml
    secrets :
      DOCKERHUB_USERNAME : ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD : ${{ secrets.DOCKERHUB_PASSWORD }}
  deploy :
    needs : CI
    runs-on : ubuntu-latest

    steps :
      - name : Azure login
        uses : azure/login@v2
        with :
          client-id : ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id : ${{ secrets.AZURE_TENANT_ID }}
          subscription-id : ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name : Deploy to Azure Container App
        run  : |
          echo "Deploying to Azure Container App... version : ${{ needs.CI.outputs.version }}"

          az containerapp update \
            --name ${{ env.ContainerApp }} \
            --resource-group ${{ env.ResourceGroup }} \
            --image ${{ env.IMAGE }}:${{ needs.CI.outputs.version }} 