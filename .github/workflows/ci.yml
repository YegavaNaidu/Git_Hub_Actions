name : Java CI

on : 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build :
    runs-on : ubuntu-latest
    
    steps:
      - name : checkout code
        uses : actions/checkout@v5

      - name : set up Java
        uses : actions/setup-java@v5
        with :
          distribution : 'temurin'
          java-version : '21'

      - name : make mvn wrapper executable
        run : chmod +x mvnw

      - name : build with maven
        run : ./mvnw clean package -DskipTests