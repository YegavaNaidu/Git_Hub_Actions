name :  CI

on : 
  workflow_call :
    secrets :
      DOCKERHUB_USERNAME :
        required : true
      DOCKERHUB_PASSWORD :
        required : true
    outputs :
      version :
        description : "Version of the docker image"
        value : ${{ jobs.release.outputs.version }}

env :
  IMAGE : ${{ secrets.DOCKERHUB_USERNAME }}/my-java-app 

jobs :
  release :
    runs-on : ubuntu-latest

    outputs :
      version : ${{ steps.version.outputs.version }}

    steps :
    - name : checkout code
      uses : actions/checkout@v5

    - name : set up Java
      uses : actions/setup-java@v5
      with :
        distribution : 'temurin'
        java-version : '21'

    - name : make mvn wrapper executable
      run : chmod +x mvnw
    
    - name : Maven build
      run : ./mvnw clean package -DskipTests

    - name : Extract version from pom.xml
      id : version
      run : |
        VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "Extracted version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT   

    - name : set up docker-buildx
      uses : docker/setup-buildx-action@v3
      
    - name : Login to DockerHub
      uses : docker/login-action@v3
      with :
        username : ${{ secrets.DOCKERHUB_USERNAME }}
        password : ${{ secrets.DOCKERHUB_PASSWORD }}
    
    - name: Validate version
      run: |
        CURRENT_VERSION="${{ steps.version.outputs.version }}"

        echo "Current application version: $CURRENT_VERSION"

        TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${{ env.IMAGE }}/tags?page_size=100" \
          | jq -r '.results[].name' \
          | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -V)

        if [ -z "$TAGS" ]; then
          echo "No previous version found. First release: $CURRENT_VERSION"
          exit 0
        fi

        LATEST_VERSION=$(echo "$TAGS" | tail -n 1)

        echo "Latest Docker version: $LATEST_VERSION"

        if [ "$(printf '%s\n' "$LATEST_VERSION" "$CURRENT_VERSION" | sort -V | tail -n 1)" != "$CURRENT_VERSION" ]; then
          echo "❌ Version $CURRENT_VERSION is not greater than $LATEST_VERSION"
          echo "Please increase the version in pom.xml"
          exit 1
        fi

        if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
          echo "❌ Version $CURRENT_VERSION already exists"
          echo "Please increase the version in pom.xml"
          exit 1
        fi

        echo "✅ Version validation passed"

    - name : build and push docker image
      uses : docker/build-push-action@v6    
      with : 
        context : .
        push : true
        tags : docker.io/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
    