name : Java CI

on : 
  push:
    branches:
      - main

jobs:
  build :
    runs-on : ubuntu-latest
    
    steps:
      - name : checkout code
        uses : actions/checkout@v3

      - name : set up Java
        uses : actions/setup-java@v4
        with :
          distribution : 'temurin'
          java-version : '21'

      - name : build with maven
        run : ./mvn clean verify